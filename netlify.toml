[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["server/**"]

[functions.api]
  timeout = 26

# API → Netlify Function (сохраняем путь /api/...)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
